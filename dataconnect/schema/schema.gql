# ─────────────────────────────────────────────────────────────────────────────
#  Esquema relacional. Cada `type ... @table` se convierte en una tabla de PostgreSQL.
#  SQL Connect genera además, para cada tabla, queries y mutations "implícitas"
#  (cursos, curso, curso_insert, curso_upsert, curso_delete, ...).
# ─────────────────────────────────────────────────────────────────────────────

# Curso: clave primaria UUID generada automáticamente (columna `id`).
type Curso @table {
  titulo: String! @col(dataType: "varchar(120)")
  nivel: String! @col(dataType: "varchar(20)")
  horas: Int!
  descripcion: String!
  cupo: Int!
}

# Alumno: la clave primaria es el UID de Firebase Auth.
# `@default(expr: "auth.uid")` hace que, al insertar, el servidor complete el id
# con el usuario autenticado: el cliente no puede elegirlo.
type Alumno @table {
  id: String! @default(expr: "auth.uid")
  nombre: String! @col(dataType: "varchar(80)")
  email: String!
}

# ─────────────────────────────────────────────────────────────────────────────
#  Relación muchos-a-muchos: un alumno puede inscribirse a muchos cursos y un
#  curso puede tener muchas matrículas. Cada fila representa una inscripción.
# ─────────────────────────────────────────────────────────────────────────────
type Matricula @table(key: ["alumno", "curso"]) {
  alumno: Alumno!
  curso: Curso!
  fecha: Timestamp! @default(expr: "request.time")
}
